name: SUPER PATCHER WITH CUSTOM GSI

permissions:
  contents: write

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      DEVICE:
        description: 'Enter Your Device Name'
        required: true
        default: 'Samsung Galaxy A14 4G SM-A145R'

      GSI:
        description: 'GSI Image Direct Link'
        required: true
        default: 'https://downloads.sourceforge.net/project/misterztr-gsi/LineageOS/Android%2015/LineageOS-22.2-20260105-GAPPS-EXT4-GSI.7z'

      NAME:
        description: 'Rom Name'
        required: true
        default: 'LineageOS-22.2-A145R-GSI.7z'

      VERSION:
        description: 'Baseband Version'
        required: true
        default: 'A145RXXSEDZE4'

      VENDOR:
        description: 'Enter Direct Link Of Your Vendor.img'
        required: true
        default: 'https://github.com/movixdestiny/Universal-Super-Patcher-Samsung-/releases/download/a14/vendor.img'

      ODM:
        description: 'Enter Direct Link Of Your odm.img'
        required: true
        default: 'https://github.com/movixdestiny/Universal-Super-Patcher-Samsung-/releases/download/a14/odm.img'

      SUPER:
        description: 'Enter The Size Of Your Super Partition'
        required: true
        default: '7843348480'


jobs:
  Build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y zip xz-utils unzip p7zip-full wget

    - name: Installing Tools
      run: |
        git clone https://github.com/Exynos-nigg/lpunpack-lpmake-mirror.git lpbinary
        cd lpbinary
        bash install.sh

    - name: Downloading Your Vendor And Odm(if applicable)
      run: |
        cd lpbinary/binary

        wget -q "${{ github.event.inputs.VENDOR }}" -O vendor.img
        wget -q "${{ github.event.inputs.ODM }}" -O odm.img

        wget -q "https://github.com/movixdestiny/Universal-Super-Patcher-Samsung-/releases/download/a14/product.img" -O product.img

        wget -q "https://github.com/movixdestiny/Universal-Super-Patcher-Samsung-/releases/download/a14/system_ext.img" -O system_ext.img

        echo "Checking downloaded files..."
        ls -lh vendor.img
        ls -lh odm.img
        ls -lh product.img
        ls -lh system_ext.img

        echo "Checking file types..."
        file vendor.img
        file odm.img
        file product.img
        file system_ext.img

    - name: Downloading Your GSI And Extracting
      run: |
        cd lpbinary/binary

        wget -q "${{ github.event.inputs.GSI }}" -O gsi.7z

        echo "GSI archive:"
        ls -lh gsi.7z

        mkdir -p sys

        7z x gsi.7z -osys

        echo "Searching for GSI image..."
        find sys -type f -name "*.img" -print

        GSI_IMAGE=$(find sys -type f -name "*.img" | head -n 1)

        if [ -z "$GSI_IMAGE" ]; then
          echo "ERROR: No .img file was found inside the GSI archive."
          exit 1
        fi

        mv "$GSI_IMAGE" system.img

        echo "GSI extracted successfully:"
        ls -lh system.img

        echo "GSI image type:"
        file system.img

    - name: Packing
      run: |
        cd lpbinary/binary

        echo "======================================"
        echo "Calculating partition sizes"
        echo "======================================"

        SYSTEM_SIZE=$(stat -c%s system.img)
        VENDOR_SIZE=$(stat -c%s vendor.img)
        PRODUCT_SIZE=$(stat -c%s product.img)
        ODM_SIZE=$(stat -c%s odm.img)
        SYSTEM_EXT_SIZE=$(stat -c%s system_ext.img)

        echo "system:     $SYSTEM_SIZE"
        echo "vendor:     $VENDOR_SIZE"
        echo "product:    $PRODUCT_SIZE"
        echo "odm:        $ODM_SIZE"
        echo "system_ext: $SYSTEM_EXT_SIZE"

        SUPER_SIZE=${{ github.event.inputs.SUPER }}

        echo "Physical super size: $SUPER_SIZE"

        echo "======================================"
        echo "Aligning partition sizes"
        echo "======================================"

        ALIGN=1048576

        align_up() {
          SIZE=$1
          echo $(( (SIZE + ALIGN - 1) / ALIGN * ALIGN ))
        }

        SYSTEM_ALIGNED=$(align_up "$SYSTEM_SIZE")
        VENDOR_ALIGNED=$(align_up "$VENDOR_SIZE")
        PRODUCT_ALIGNED=$(align_up "$PRODUCT_SIZE")
        ODM_ALIGNED=$(align_up "$ODM_SIZE")
        SYSTEM_EXT_ALIGNED=$(align_up "$SYSTEM_EXT_SIZE")

        echo "system aligned:     $SYSTEM_ALIGNED"
        echo "vendor aligned:     $VENDOR_ALIGNED"
        echo "product aligned:    $PRODUCT_ALIGNED"
        echo "odm aligned:        $ODM_ALIGNED"
        echo "system_ext aligned: $SYSTEM_EXT_ALIGNED"

        MAIN_SIZE=$(
          (
            SYSTEM_ALIGNED +
            VENDOR_ALIGNED +
            PRODUCT_ALIGNED +
            ODM_ALIGNED +
            SYSTEM_EXT_ALIGNED +
            8388608
          )
        )

        echo "Calculated main group size: $MAIN_SIZE"

        if [ "$MAIN_SIZE" -ge "$SUPER_SIZE" ]; then
          echo "ERROR: Calculated main group is larger than physical super."
          echo "main:  $MAIN_SIZE"
          echo "super: $SUPER_SIZE"
          exit 1
        fi

        echo "======================================"
        echo "Building custom super.img"
        echo "======================================"

        ./lpmake \
          --metadata-size 65536 \
          --super-name super \
          --metadata-slots 2 \
          --device "super:${SUPER_SIZE}" \
          --group "main:${MAIN_SIZE}" \
          --partition "system:readonly:${SYSTEM_ALIGNED}:main" \
          --image "system=system.img" \
          --partition "vendor:readonly:${VENDOR_ALIGNED}:main" \
          --image "vendor=vendor.img" \
          --partition "product:readonly:${PRODUCT_ALIGNED}:main" \
          --image "product=product.img" \
          --partition "odm:readonly:${ODM_ALIGNED}:main" \
          --image "odm=odm.img" \
          --partition "system_ext:readonly:${SYSTEM_EXT_ALIGNED}:main" \
          --image "system_ext=system_ext.img" \
          --sparse \
          --output super.img

        echo "======================================"
        echo "super.img successfully created"
        echo "======================================"

        ls -lh super.img

        file super.img

    - name: Verify Super Image
      run: |
        cd lpbinary/binary

        echo "Checking generated super.img..."

        if [ ! -f super.img ]; then
          echo "ERROR: super.img was not created."
          exit 1
        fi

        SIZE=$(stat -c%s super.img)

        echo "Generated super.img size:"
        echo "$SIZE bytes"

        if [ "$SIZE" -gt "${{ github.event.inputs.SUPER }}" ]; then
          echo "ERROR: Generated super.img is larger than physical super partition."
          exit 1
        fi

        echo "Super image is within physical partition size."

    - name: Creating tar and compressing to 7z
      run: |
        cd lpbinary/binary

        tar -cvf super.tar super.img

        rm -rf super.img

        7z a "${{ github.event.inputs.NAME }}" super.tar

        rm -rf super.tar

        echo "Final package:"
        ls -lh "${{ github.event.inputs.NAME }}"

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: lpbinary/binary/${{ github.event.inputs.NAME }}
        name: ${{ github.event.inputs.NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Device: ${{ github.event.inputs.DEVICE }}
          Version: ${{ github.event.inputs.VERSION }}
          Rom Name: ${{ github.event.inputs.NAME }}

          Physical Super Size:
          ${{ github.event.inputs.SUPER }}

          Flash:
          Extract the 7z file and flash through ODIN in AP Section.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
